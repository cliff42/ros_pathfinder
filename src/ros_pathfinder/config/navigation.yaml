path_planner:
  ros__parameters:
    base_frame: base_link
    robot_radius_m: 0.35
    safety_margin_m: 0.02
    occupied_threshold: 65
    allow_unknown: true
    unknown_cost_multiplier: 3.0
    replan_on_blocked_path: true
    blocked_path_confirmations: 2
    replan_cooldown_s: 1.5
    goal_position_tolerance_m: 0.12

path_follower:
  ros__parameters:
    base_frame: base_link
    control_rate_hz: 20.0
    transform_timeout_s: 1.0
    desired_linear_velocity_m_s: 0.18
    minimum_lookahead_distance_m: 0.10
    lookahead_time_s: 0.30
    maximum_lookahead_distance_m: 0.18
    goal_position_tolerance_m: 0.12
    goal_position_tolerance_buffer_m: 0.05
    goal_yaw_tolerance_rad: 0.25
    rotate_in_place_threshold_rad: 0.85
    angular_gain: 1.0
    max_angular_velocity_rad_s: 0.65
    minimum_linear_speed_ratio: 0.20
    angular_smoothing: 0.20
    angular_deadband_rad_s: 0.015
    collision_monitor_enabled: true
    scan_timeout_s: 0.5
    footprint_min_x_m: -0.15
    footprint_max_x_m: 0.50
    footprint_min_y_m: -0.30
    footprint_max_y_m: 0.30
    collision_margin_m: 0.02
    collision_prediction_horizon_s: 0.75
    collision_prediction_step_s: 0.05
