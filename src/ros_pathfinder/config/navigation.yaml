/**:
  ros__parameters:
    footprint_min_x_m: -0.127
    footprint_max_x_m: 0.477
    footprint_min_y_m: -0.2655
    footprint_max_y_m: 0.2655
    collision_margin_m: 0.02

slam_node:
  ros__parameters:
    scan_transform_timeout_s: 0.25
    transform_publish_rate_hz: 30.0
    diagnostic_logging_enabled: true
    diagnostic_log_period_s: 0.25
    self_filter_padding_m: 0.02

path_planner:
  ros__parameters:
    base_frame: base_link
    # Nominal center clearance used for the fast first planning pass. Every
    # resulting path is also checked with the shared full footprint above.
    robot_radius_m: 0.35
    occupied_threshold: 65
    allow_unknown: true
    unknown_cost_multiplier: 3.0
    replan_on_blocked_path: true
    blocked_path_confirmations: 2
    replan_cooldown_s: 1.5
    goal_position_tolerance_m: 0.12
    minimum_frontier_size_cells: 5
    minimum_frontier_distance_m: 0.30
    frontier_size_weight: 1.0
    exploration_goal_pause_s: 0.75
    maximum_start_projection_distance_m: 0.50
    exploration_completion_confirmations: 3
    planning_mode: goal

path_follower:
  ros__parameters:
    base_frame: base_link
    control_rate_hz: 20.0
    transform_timeout_s: 1.0
    desired_linear_velocity_m_s: 0.24
    minimum_lookahead_distance_m: 0.10
    lookahead_time_s: 0.30
    maximum_lookahead_distance_m: 0.10
    goal_position_tolerance_m: 0.12
    goal_position_tolerance_buffer_m: 0.05
    goal_yaw_tolerance_rad: 0.25
    goal_settle_time_s: 0.25
    goal_linear_velocity_tolerance_m_s: 0.03
    goal_angular_velocity_tolerance_rad_s: 0.15
    rotate_in_place_threshold_rad: 0.85
    angular_gain: 1.0
    max_angular_velocity_rad_s: 0.65
    minimum_linear_speed_ratio: 0.20
    angular_smoothing: 0.20
    angular_deadband_rad_s: 0.015
    diagnostic_logging_enabled: true
    diagnostic_log_period_s: 0.25
    collision_monitor_enabled: true
    scan_timeout_s: 0.5
    self_filter_padding_m: 0.02
    collision_prediction_horizon_s: 0.40
    collision_prediction_step_s: 0.05
    collision_confirmation_scans: 2
